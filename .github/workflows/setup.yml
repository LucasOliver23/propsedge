name: setup

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Dias de histórico"
        default: "30"
      sports:
        description: "Esportes (vazio = todos)"
        default: ""
      admin_email:
        description: "Seu e-mail de login (vira Elite)"
        default: ""

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Localizar pasta do projeto
        run: |
          if [ -d propsedge/workers ]; then echo "ROOT=propsedge" >> "$GITHUB_ENV"; else echo "ROOT=." >> "$GITHUB_ENV"; fi
          ls -la

      - name: Dependencias
        run: |
          cd "$ROOT"
          pip install -r workers/requirements.txt
          which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Conferir segredos
        run: |
          test -n "$DATABASE_URL" || (echo "::error::Secret DATABASE_URL nao configurado" && exit 1)
          psql "$DATABASE_URL" -X -tAc "select 'conexao OK'"

      - name: 1. Migrations
        run: |
          cd "$ROOT"
          bash scripts/migrate.sh

      - name: 2. Carga de dados
        run: |
          cd "$ROOT/workers"
          SPORTS="${{ inputs.sports }}"
          python run.py setup --days "${{ inputs.days }}" ${SPORTS:+--sports "$SPORTS"}

      - name: 3. Promover admin
        if: ${{ inputs.admin_email != '' }}
        run: |
          psql "$DATABASE_URL" -X -c "update profiles set plan = 'elite' where id = (select id from auth.users where lower(email) = lower('${{ inputs.admin_email }}'));"

      - name: 4. Diagnostico
        if: always()
        run: |
          cd "$ROOT"
          psql "$DATABASE_URL" -X -f scripts/diagnose.sql
